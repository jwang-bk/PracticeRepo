<div class="login-container">
  <div class="login-card">
    <h1 class="app-title">Practice App</h1>

    <div class="tab-bar">
      <button
        class="tab-btn"
        [class.active]="activeTab === 'login'"
        (click)="activeTab = 'login'; errorMessage = ''">
        Login
      </button>
      <button
        class="tab-btn"
        [class.active]="activeTab === 'register'"
        (click)="activeTab = 'register'; errorMessage = ''">
        Register
      </button>
    </div>

    <div *ngIf="errorMessage" class="alert alert-error">{{ errorMessage }}</div>

    <!-- Login Form -->
    <form *ngIf="activeTab === 'login'" (ngSubmit)="onLogin()" class="form">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          [(ngModel)]="username"
          name="username"
          placeholder="Enter username"
          autocomplete="username"
          required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Enter password"
          autocomplete="current-password"
          required />
      </div>
      <button type="submit" class="btn btn-primary" [disabled]="isLoading">
        {{ isLoading ? 'Signing in...' : 'Sign In' }}
      </button>
      <p class="hint">Demo — admin / Admin123! &nbsp;|&nbsp; user / User123!</p>
    </form>

    <!-- Register Form -->
    <form *ngIf="activeTab === 'register'" (ngSubmit)="onRegister()" class="form">
      <div class="form-group">
        <label for="reg-username">Username</label>
        <input
          id="reg-username"
          type="text"
          [(ngModel)]="registerUsername"
          name="registerUsername"
          placeholder="Choose a username"
          autocomplete="username"
          required />
      </div>
      <div class="form-group">
        <label for="reg-email">Email</label>
        <input
          id="reg-email"
          type="email"
          [(ngModel)]="registerEmail"
          name="registerEmail"
          placeholder="Enter email"
          autocomplete="email"
          required />
      </div>
      <div class="form-group">
        <label for="reg-password">Password</label>
        <input
          id="reg-password"
          type="password"
          [(ngModel)]="registerPassword"
          name="registerPassword"
          placeholder="Min 6 chars, 1 digit"
          autocomplete="new-password"
          required />
      </div>
      <div class="form-group">
        <label for="reg-role">Role</label>
        <select id="reg-role" [(ngModel)]="registerRole" name="registerRole">
          <option value="User">User</option>
          <option value="Admin">Admin</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary" [disabled]="isLoading">
        {{ isLoading ? 'Creating account...' : 'Create Account' }}
      </button>
    </form>
  </div>
</div>
